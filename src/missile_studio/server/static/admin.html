<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>missile studio · admin</title>
<link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon.png?v=0.11.1"><link rel="apple-touch-icon" sizes="180x180" href="/static/brand/apple-touch-icon.png?v=0.11.1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=0.11.1">
<script>try{var t=localStorage.getItem('missile_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<script src="/static/i18n.js?v=0.11.1"></script>
<script src="/static/icons.js?v=0.11.1"></script>
<style>
  .admin { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
  .anav { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; }
  .anav .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
  .anav .brand .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--fg); color: var(--bg); font-weight: 700; }
  .anav .brand .t { font-weight: 600; } .anav .brand .s { font-size: 11.5px; color: var(--fg-muted); }
  .anav button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: var(--r-md); color: var(--fg); cursor: pointer; text-align: left; font-weight: 500; }
  .anav button:hover { background: var(--bg-subtle); } .anav button.active { background: var(--card); box-shadow: inset 0 0 0 1px var(--border); }
  .anav .foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 4px; }
  .acontent { overflow: auto; }
  .warnbar { background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 50%, var(--border)); border-radius: var(--r-md); padding: 9px 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .warnbar a, .warnbar button { margin-left: auto; }
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 6px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; height: 100%; position: relative; }
  .chart .col div { border-radius: 2px 2px 0 0; min-height: 1px; }
  .chart .m { background: var(--primary); } .chart .t { background: var(--info); opacity: .8; } .chart .e { background: var(--destructive); }
  .chart .col .lbl { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--fg-3); }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--fg-muted); margin-top: 20px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .m::before { background: var(--primary); } .legend .t::before { background: var(--info); } .legend .e::before { background: var(--destructive); }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 6px 12px; font-size: 13px; } .kv dt { color: var(--fg-muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .evt { border-bottom: 1px solid var(--border); padding: 8px 12px; display: grid; grid-template-columns: 150px 70px 90px 1fr 120px; gap: 10px; font-size: 13px; cursor: pointer; }
  .evt:hover { background: var(--bg-subtle); } .evt .d { grid-column: 1 / -1; } .evt pre { margin: 4px 0 0; font-size: 11.5px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; white-space: pre-wrap; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .changed { color: var(--warning); font-size: 11px; margin-left: 6px; }
  .setting-row { display: grid; grid-template-columns: 260px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .setting-row:last-child { border-bottom: 0; }
  .setting-row .k { font-weight: 500; } .setting-row .h { font-size: 12px; color: var(--fg-muted); }
  .setting-row .c { display: flex; gap: 8px; align-items: center; }
  .setting-row .c .input, .setting-row .c .select { max-width: 360px; }
  @media (max-width: 900px) { .admin { grid-template-columns: 1fr; } .anav { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; } .anav .brand, .anav .foot { display: none; } .anav button { width: auto; white-space: nowrap; } .setting-row { grid-template-columns: 1fr; } .evt { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="/static/admin.js?v=0.11.1"></script>
</body>
</html>
